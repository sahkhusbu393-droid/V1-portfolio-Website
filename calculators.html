<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator App</title>
  <!-- css link -->
  <link rel="stylesheet" href="assets/css/calculators.css">
  <!-- js link -->
</head>
<body>
  <div class="calculator">
    <input type="text" readonly id="display">
    <br>
    <button onclick="pree('1')">1</button>
    <button onclick="pree('2')">2</button>
    <button onclick="pree('3')">3</button>
    <button onclick="pree('+')">+</button>
    <br>
    <button onclick="pree('4')">4</button>
    <button onclick="pree('5')">5</button>
    <button onclick="pree('6')">6</button>
    <button onclick="pree('-')">-</button>
    <br>
    <button onclick="pree('7')">7</button>
    <button onclick="pree('8')">8</button>
    <button onclick="pree('9')">9</button>
    <button onclick="pree('*')">*</button>
    <br>
    <button onclick="pree('0')">0</button>
    <button onclick="pree('.')">.</button>
      <button onclick="pree('(')">(</button>
      <button onclick="pree(')')">)</button>
    <br>
     <button onclick="calculator('=')">=</button>
       <button onclick="backspace()">⌫</button>
     <button onclick="Cleardisplay('c')">C</button>
    <button onclick="pree('/')">/</button>
  </div>
</body>
<script src="assets/js/Calculator App.js"></script>
</html>
